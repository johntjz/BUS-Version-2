<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pulse NLB - Hybrid Engine</title>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
    --accent-blue: #0a84ff;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; 
  }
  .header {
    background-color: var(--accent-red);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left { display: flex; flex-direction: column; }
  .title-row { display: flex; align-items: baseline; gap: 8px; }
  .header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .build-badge { font-size: 0.6rem; color: rgba(255, 255, 255, 0.7); font-family: monospace; font-weight: 600; letter-spacing: 0.5px; }
  .clock { font-size: 0.75rem; font-weight: 500; opacity: 0.9; margin-top: 2px; font-variant-numeric: tabular-nums; }
  
  select.lang-select {
    background: rgba(0,0,0,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; outline: none; cursor: pointer; flex-shrink: 0;
  }
  .stop-header {
    padding: 12px 16px; border-bottom: 1px solid var(--card-border);
    display: flex; justify-content: space-between; align-items: flex-start;
    background-color: var(--bg-color); gap: 12px; flex-wrap: wrap;
  }
  .controls-container { display: flex; gap: 10px; flex: 1 1 100%; min-width: 0; }
  .gps-btn {
    background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    width: 44px; height: 72px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .gps-btn:active { background: #3a3a3c; }
  .selectors { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  select.stop-input {
    background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    padding: 8px 32px 8px 12px; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; outline: none;
    width: 100%; appearance: none; -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989d" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat; background-position: right 8px center;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  }
  .status-bar { display: flex; flex-direction: column; align-items: flex-end; width: 100%; }
  .refresh-timer { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }
  .gps-status { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; margin-top: 4px; text-align: right; }
  
  #routeList { display: flex; flex-direction: column; min-height: 50vh; padding-bottom: 24px; }
  .route-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid var(--card-border); gap: 8px;
  }
  .route-left { display: flex; align-items: flex-start; gap: 12px; flex: 1; min-width: 0; }
  .route-no { font-size: 1.6rem; font-weight: 900; min-width: 45px; letter-spacing: -0.5px; flex-shrink: 0; margin-top: 2px;}
  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .route-dest { font-size: 1.05rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  
  /* Hybrid Engine Static Meta Tags */
  .route-meta-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .meta-tag { background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 4px; padding: 2px 6px; font-size: 0.65rem; color: #a1a1aa; font-weight: 600; display: flex; align-items: center; gap: 3px; }
  .meta-tag.fare { color: #30d158; }

  .eta-container { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 42px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; text-align: right; }
  .official-eta { font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); text-decoration: line-through; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .smart-eta { font-size: 1.45rem; font-weight: 800; color: var(--accent-green); font-variant-numeric: tabular-nums; transition: color 0.3s; }
  .smart-eta.adjusted { color: var(--accent-blue); }
  
  @keyframes blink-arriving {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
  .smart-eta.arriving { color: var(--accent-orange); font-size: 1.25rem; animation: blink-arriving 1.5s infinite; }

  .compact-occupancy { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .bar-segments { display: flex; gap: 2px; }
  .segment { width: 7px; height: 12px; border-radius: 2px; background-color: #2c2c2e; }
  .segment.active-green { background-color: var(--accent-green); }
  .segment.active-orange { background-color: var(--accent-orange); }
  .segment.active-red { background-color: var(--accent-red); }

  /* Inactive Routes Toggle */
  .route-card.inactive { display: none; }
  .show-inactive .route-card.inactive { display: flex; }
  .toggle-btn {
    background: transparent; color: var(--accent-secondary, #98989d); border: 1px solid var(--card-border);
    padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title-row">
      <h1>Pulse NLB</h1>
      <span class="build-badge" id="buildVersion"></span>
    </div>
    <span class="clock" id="liveClock">--:--:--</span>
  </div>
  <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
    <option value="en">EN</option>
    <option value="tc">繁體</option>
    <option value="sc">简体</option>
  </select>
</div>

<div class="stop-header">
  <div class="controls-container">
    <button id="gpsBtn" class="gps-btn" onclick="locateNearestStop(false, false)">📍</button>
    <div class="selectors">
      <select id="routeSelect" class="stop-input" onchange="handleRouteChange(this.value)"></select>
      <select id="stopSelect" class="stop-input" onchange="handleStopChange(this.value)"></select>
    </div>
  </div>
  <div class="status-bar">
    <span class="refresh-timer" id="refreshTimer">Initializing...</span>
    <span class="gps-status" id="gpsStatus"></span>
  </div>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary); text-align: center;" id="loadingText">Connecting to network...</div>
</div>

<script>
// ==========================================
// CONFIGURATION & ENGINES
// ==========================================
const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const REFRESH_INTERVAL = 15; 
const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;
const APP_VERSION = "v.1030_HYBRID";

// Add filenames of static route files you create here.
// The engine will dynamically load them on boot.
const STATIC_FILES_TO_LOAD = ['34']; 
const staticEngineMeta = {}; // Will hold enhanced route meta mapped to dynamic Gov routeIds

const vEl = document.getElementById("buildVersion");
if (vEl) vEl.innerText = APP_VERSION;

let currentLang = localStorage.getItem('pulse_lang') || 'en';
if (document.getElementById('langSelect')) document.getElementById('langSelect').value = currentLang;

const i18n = {
  en: {
    allLines: "All", loadingIndex: "Loading station index...",
    syncing: "Syncing Network Mappings...", building: "Building Station Index...", booting: "Booting Hybrid Engine...",
    liveETA: "Fetching live arrivals...", locating: "Locating...", nearest: "Nearest:",
    noStops: "No stops found", gpsDenied: "GPS Denied / Failed",
    gpsNotSupported: "GPS Not Supported", noBuses: "No active buses depart from here currently.",
    to: "To", due: "Due", min: "m", refresh: "Refresh in", refreshing: "Refreshing...",
    official: "Official", actual: "Actual ETA", scheduled: "Scheduled (No GPS)",
    arrivingLabel: "Status", arriving: "Arriving...",
    showInactive: "Show inactive routes", hideInactive: "Hide inactive routes"
  },
  tc: {
    allLines: "所有", loadingIndex: "載入車站索引...",
    syncing: "同步網絡數據...", building: "建立車站索引...", booting: "啟動混合數據引擎...",
    liveETA: "獲取實時班次...", locating: "定位中...", nearest: "最近:",
    noStops: "找不到車站", gpsDenied: "定位失敗/被拒絕",
    gpsNotSupported: "不支援定位", noBuses: "目前沒有巴士從此站開出。",
    to: "往", due: "即將到達", min: "分鐘", refresh: "更新:", refreshing: "更新中...",
    official: "官方", actual: "實際預計", scheduled: "預定班次 (無GPS)",
    arrivingLabel: "狀態", arriving: "即將抵達...",
    showInactive: "顯示未有班次路線", hideInactive: "隱藏未有班次路線"
  },
  sc: {
    allLines: "所有", loadingIndex: "载入车站索引...",
    syncing: "同步网络数据...", building: "建立车站索引...", booting: "启动混合数据引擎...",
    liveETA: "获取实时班次...", locating: "定位中...", nearest: "最近:",
    noStops: "找不到车站", gpsDenied: "定位失败/被拒绝",
    gpsNotSupported: "不支持定位", noBuses: "目前没有巴士从此站开出。",
    to: "往", due: "即将到达", min: "分钟", refresh: "更新:", refreshing: "更新中...",
    official: "官方", actual: "实际预计", scheduled: "预定班次 (无GPS)",
    arrivingLabel: "状态", arriving: "即将抵达...",
    showInactive: "显示未有班次路线", hideInactive: "隐藏未有班次路线"
  }
};

const getT = (key) => i18n[currentLang][key];

let currentRouteKey = 'ALL';
let currentStopName_e = '';
let countdown = REFRESH_INTERVAL;
let timerInterval;

let allStops = [];
let rawRoutes = [];
let groupedRoutes = []; 
let routeStopsCache = {};
const busStateMap = {}; 

let showInactive = false;
function toggleInactive() {
  showInactive = !showInactive;
  const listEl = document.getElementById('routeList');
  if (showInactive) listEl.classList.add('show-inactive');
  else listEl.classList.remove('show-inactive');
  const btn = document.getElementById('toggleInactiveBtn');
  if (btn) btn.innerText = showInactive ? getT('hideInactive') : getT('showInactive');
}

// ==========================================
// HYBRID ENGINE BOOT LOADER & DATA FUSION
// ==========================================
async function bootStaticEngine() {
  window.BusData = window.BusData || { NLB: [] };
  document.getElementById('loadingText').innerText = getT('booting');
  
  const promises = STATIC_FILES_TO_LOAD.map(routeNo => {
    return new Promise((resolve) => {
      const script = document.createElement('script');
      // Adjust path if your structure is different
      script.src = `/routes/nlb/${routeNo.toLowerCase()}.js`; 
      script.onload = resolve;
      script.onerror = resolve; // Always resolve to not break the boot sequence
      document.head.appendChild(script);
    });
  });
  
  await Promise.all(promises);
}

function fuseStaticWithDynamicData() {
  if (!window.BusData || !window.BusData.NLB || window.BusData.NLB.length === 0) return;
  
  const staticDB = window.BusData.NLB;
  
  rawRoutes.forEach(dRoute => {
    // Clean string for matching
    const dDest = (dRoute.routeName_e.split('>').pop() || "").replace(/\s*\([^)]*\)/g, '').trim().toLowerCase();
    
    // Find static match
    const matchedStatic = staticDB.find(sRoute => {
      const sDest = sRoute.destination_e.toLowerCase();
      return sRoute.routeNo === dRoute.routeNo && 
             (dDest.includes(sDest) || sDest.includes(dDest));
    });

    if (matchedStatic) {
      // Save matched meta info against the API's routeId
      staticEngineMeta[dRoute.routeId] = matchedStatic;

      // Enhance Stop Lat/Long precision
      const dStops = routeStopsCache[dRoute.routeId];
      if (dStops) {
        dStops.forEach(dStop => {
          const sStop = matchedStatic.stops.find(s => 
            s.stopName_e.toLowerCase().includes(dStop.stopName_e.toLowerCase()) || 
            dStop.stopName_e.toLowerCase().includes(s.stopName_e.toLowerCase())
          );
          if (sStop) {
            dStop.latitude = sStop.latitude; // Override API coord with precision static coord
            dStop.longitude = sStop.longitude;
            dStop.staticFare = sStop.weekdayFare; // Store fare on stop for future
          }
        });
      }
    }
  });
}

// ==========================================
// CORE APP LOGIC
// ==========================================
class KalmanFilter1D {
  constructor(processNoise, measurementNoise, initialEstimate, initialError) {
    this.q = processNoise; 
    this.r = measurementNoise; 
    this.x = initialEstimate; 
    this.p = initialError; 
  }
  update(measurement, dt, isOptimistic) {
    this.x = this.x - dt; 
    this.p = this.p + this.q; 
    const currentR = isOptimistic ? (this.r * 0.2) : this.r; 
    const k = this.p / (this.p + currentR); 
    this.x = this.x + k * (measurement - this.x); 
    this.p = (1 - k) * this.p; 
    return Math.max(0, this.x); 
  }
}

function generateDeterministicNoise(routeStr, currentStopIndex, timestamp) {
  const timeBlock = Math.floor(timestamp / 300000); 
  const seed = `${routeStr}-${currentStopIndex}-${timeBlock}`;
  let hash = 0;
  for (let i = 0; i < seed.length; i++) {
    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
    hash |= 0; 
  }
  const normalized = (Math.abs(hash) % 100) / 100;
  return (normalized * 6) - 3;
}

setInterval(() => {
  const clockEl = document.getElementById('liveClock');
  if (clockEl) {
    clockEl.innerText = new Date().toLocaleTimeString(
      currentLang === 'en' ? 'en-US' : 'zh-HK', 
      { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: currentLang==='en' }
    );
  }
}, 1000);

async function fetchJSON(endpoint) {
  const response = await fetch(`${API_BASE}${endpoint}`, { cache: 'no-store' });
  if (!response.ok) throw new Error('API offline');
  return await response.json();
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('pulse_lang', lang);
  populateRouteDropdown();
  const targetGroup = groupedRoutes.find(g => g.key === currentRouteKey);
  populateStopDropdown(targetGroup && currentRouteKey !== 'ALL' ? getStopsForGroup(targetGroup) : allStops);
  updateNetworkTelemetry();
}

function getLocalizedName(obj, prefix)
