<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Bus HK - Dark Mode KMB Style</title>
<!-- Leaflet CSS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --kmb-red: #e31837;
    --bg-light: #121212;
    --bg-white: #1e1e1e;
    --text-main: #ffffff;
    --text-sub: #aaaaaa;
    --border-color: #333333;
    --accent-blue: #0a84ff;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg-light);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* Header */
  .header {
    background-color: var(--kmb-red);
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1001; /* Above map */
    height: 55px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
  .back-btn {
    position: absolute; left: 16px; top: 0; bottom: 0; display: none;
    align-items: center; justify-content: center; background: none; border: none; color: white;
    font-size: 2rem; font-weight: bold; cursor: pointer; padding: 0 10px;
  }
  .header-actions {
    position: absolute; right: 16px; top: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
  }
  .fav-toggle-btn { background: none; border: none; color: white; font-size: 1.5rem; display: none; cursor: pointer; }

  /* Views */
  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-white);
  }
  .view-container.active { display: flex; }

  /* Bottom Tabs */
  .bottom-tabs {
    background-color: var(--bg-white); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    height: 70px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.8rem; gap: 4px;
    transition: color 0.2s;
  }
  .tab.active { color: var(--kmb-red); font-weight: 700; }
  .tab-icon { font-size: 1.6rem; }

  /* Main / Nearby View */
  .location-header {
    background: var(--bg-light); padding: 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .refresh-timer { font-size: 1rem; color: var(--kmb-red); font-weight: 800; }
  
  .route-list-item {
    display: flex; padding: 18px 16px; border-bottom: 1px solid var(--border-color);
    align-items: center; gap: 12px; cursor: pointer; background: var(--bg-white);
    transition: background 0.2s;
  }
  .route-list-item:active { background: var(--bg-light); }
  .route-no-col { width: 60px; font-size: 1.8rem; font-weight: 900; text-align: center; color: var(--text-main); }
  .route-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .route-dest { font-size: 1.25rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  .route-sub { font-size: 0.9rem; color: var(--text-sub); }
  .route-eta-col { text-align: right; min-width: 70px; }
  .eta-time { font-size: 1.8rem; font-weight: 800; color: var(--accent-green); }
  .eta-label { font-size: 0.75rem; color: var(--text-sub); font-weight: bold; text-transform: uppercase; }

  /* ETA Expansion Area (Main View & Detail View) */
  .eta-expanded-container {
    display: none; flex-direction: column; gap: 12px; padding: 16px; 
    background: #181818; border-bottom: 1px solid var(--border-color);
  }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .eta-row-left { display: flex; align-items: center; gap: 12px; font-size: 1rem; color: var(--text-sub); }
  .eta-row-seq { display: inline-block; width: 20px; font-weight: 900; color: var(--kmb-red); font-size: 1.1rem; }
  .eta-row-time { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }

  /* Search View */
  .search-box-container { padding: 16px; background: var(--bg-light); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
  .search-input {
    width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 10px;
    font-size: 1.2rem; outline: none; text-align: center; background: var(--bg-white); color: var(--text-main); font-weight: 600;
  }
  .search-input:focus { border-color: var(--kmb-red); }
  
  .region-filters { display: flex; gap: 8px; justify-content: center; }
  .region-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
    background: var(--bg-white); color: var(--text-sub); font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .region-btn.active { background: var(--kmb-red); color: white; border-color: var(--kmb-red); }

  /* Route Detail View (Map + Accordion) */
  #map-container { height: 35vh; width: 100%; background: #222; flex-shrink: 0; }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-white); }
  
  .stop-item {
    position: relative; padding: 20px 16px 20px 45px; border-bottom: 1px solid var(--border-color); cursor: pointer;
  }
  .stop-line {
    position: absolute; left: 24px; top: 0; bottom: 0; width: 3px; background-color: var(--kmb-red); z-index: 1;
  }
  .stop-item:first-child .stop-line { top: 30px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 30px; }
  .stop-dot {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px;
    border-radius: 50%; background: #aaa; border: 3px solid var(--bg-white); z-index: 2;
  }
  .stop-item.active-stop .stop-dot { background: var(--kmb-red); box-shadow: 0 0 0 3px rgba(227,24,55,0.4); }
  .stop-name { font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
  
  /* Utilities & Status */
  .text-center { text-align: center; padding: 24px; color: var(--text-sub); font-size: 1.1rem; }
  .show-inactive-btn {
    display: block; margin: 20px auto; padding: 12px 24px; border: 1px solid var(--border-color);
    background: var(--bg-light); border-radius: 24px; font-size: 1rem; cursor: pointer; color: var(--text-main); font-weight: 600;
  }
  .init-loader { padding: 50px 20px; text-align: center; }
  .progress-bar { width: 85%; height: 8px; background: #333; margin: 15px auto; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--kmb-red); width: 0%; transition: 0.3s; }
  
  /* Occupancy Pills - Bigger & Obvious */
  .occ-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; color: white; display: inline-block; min-width: 80px; text-align: center; text-transform: uppercase; }
  .occ-seating { background: var(--accent-green); }
  .occ-standing { background: var(--accent-orange); }
  .occ-full { background: var(--kmb-red); }

  .add-fav-btn {
      margin: 20px; padding: 16px; background: var(--bg-light); border: 2px dashed var(--border-color);
      border-radius: 12px; text-align: center; color: var(--accent-blue); font-size: 1.1rem; font-weight: 700;
      cursor: pointer;
  }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Bus HK</h1>
  <div class="header-actions">
      <button class="fav-toggle-btn" id="favRouteBtn" onclick="toggleFavRoute()">☆</button>
  </div>
</header>

<!-- Main / Nearby View -->
<main id="view-main" class="view-container active">
  <div class="location-header">
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size: 1.5rem; color: var(--kmb-red);">📍</span>
        <div class="location-text" id="mainLocationText">Locating nearest stop...</div>
    </div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader">
          <div id="loadText" style="font-size:1.1rem; color:var(--text-main);">Connecting to network...</div>
          <div class="progress-bar"><div class="progress-fill" id="loadBar"></div></div>
      </div>
  </div>
  <button class="show-inactive-btn" id="toggleInactiveBtn" onclick="toggleInactive()" style="display:none;">Show Inactive Routes</button>
</main>

<!-- Search View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
    <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All</button>
        <button class="region-btn" id="filter-KMB" onclick="setRegionFilter('KMB')">KMB</button>
        <button class="region-btn" id="filter-LWB" onclick="setRegionFilter('LWB')">LWB</button>
        <button class="region-btn" id="filter-NLB" onclick="setRegionFilter('NLB')">NLB</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Enter Route Number" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main">
    <span class="tab-icon">🏠</span>
    <span>Main</span>
  </div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav">
    <span class="tab-icon">⭐</span>
    <span>Favorites</span>
  </div>
  <div class="tab" onclick="switchTab('search')" id="tab-search">
    <span class="tab-icon">🔍</span>
    <span>Search</span>
  </div>
</nav>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// --- Configuration & State ---
const NLB_API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const KMB_API_BASE = 'https://data.etabus.gov.hk/v1/transport/kmb';
const REFRESH_INTERVAL = 15; 
const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

let currentView = 'main'; // main, search, fav, detail
let previousView = 'main';
let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
let favRoutes = JSON.parse(localStorage.getItem('kmb_fav_routes_v2') || '[]');

let lastKnownPos = null;
let currentNearestStopKey = null;

// Search State
let activeRegionFilter = 'ALL';

// Main View Expansion State
let mainExpandedGroupKey = null;

// Detail View State
let detailRouteGroup = null;
let detailExpandedStopIdx = -1;
let mapInstance = null;
let mapRouteLayer = null;
let mapMarkers = [];
let userMarker = null;

// Timers
let countdown = REFRESH_INTERVAL;
let timerInterval = null;
let isSyncing = false;
let showInactive = false;

// ETAs Cache to prevent over-fetching
const etaCache = {};

// --- Initialization & Data Fetching ---
async function fetchJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('API offline');
  return await response.json();
}

function getGlobalStopKey(s) {
    const lat = parseFloat(s.latitude) || 0;
    return `${s.stopName_e}_${lat.toFixed(1)}`;
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*[\(（][^\)）]*[\)）]/g, '').trim();
}

function setLoadProgress(pct, text) {
  const fill = document.getElementById('loadBar');
  const txt = document.getElementById('loadText');
  if (fill) fill.style.width = `${pct}%`;
  if (txt) txt.innerText = text;
}

async function initApp() {
  try {
    const cachedGrouped = localStorage.getItem('kmb_grouped_v2');
    const cachedStops = localStorage.getItem('kmb_stops_v2');
    const cacheTime = localStorage.getItem('kmb_cache_time_v2');
    const now = Date.now(); 

    let loadedFromCache = false;
    if (cachedGrouped && cachedStops && cacheTime && (now - parseInt(cacheTime) < CACHE_EXPIRY_MS)) {
      try {
          setLoadProgress(100, "Loading from cache...");
          groupedRoutes = JSON.parse(cachedGrouped);
          routeStopsCache = JSON.parse(cachedStops);
          loadedFromCache = true;
      } catch (e) { localStorage.removeItem('kmb_cache_time_v2'); }
    } 
    
    if (!loadedFromCache) {
      setLoadProgress(10, "Fetching Network Data...");
      const groupedMap = new Map();
      routeStopsCache = {};

      // 1. Fetch NLB
      try {
          const nlbRData = await fetchJSON(`${NLB_API_BASE}/route.php?action=list`);
          const rawNlbRoutes = nlbRData.routes || [];
          
          rawNlbRoutes.forEach(r => {
            const dest_e = r.routeName_e ? r.routeName_e.split('>').pop().trim() : '';
            const cleanDest = cleanStopName(dest_e); 
            const key = `NLB_${r.routeNo}___${cleanDest}`.replace(/[^a-zA-Z0-9_-]/g, '_');

            if (!groupedMap.has(key)) {
              groupedMap.set(key, { key, routeNo: r.routeNo, dest_e: cleanDest, routeIds: [`NLB_${r.routeId}`], company: 'NLB' });
            } else {
              groupedMap.get(key).routeIds.push(`NLB_${r.routeId}`);
            }
          });

          const chunkSize = 15;
          for (let i = 0; i < rawNlbRoutes.length; i += chunkSize) {
            const chunk = rawNlbRoutes.slice(i, i + chunkSize);
            await Promise.all(chunk.map(async (r) => {
              try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=list&routeId=${r.routeId}`);
                routeStopsCache[`NLB_${r.routeId}`] = (res.stops || []).map(s => ({...s, stopName_e: cleanStopName(s.stopName_e)}));
              } catch(e) {}
            }));
            setLoadProgress(10 + ((i / rawNlbRoutes.length) * 30), "Syncing Lantau Routes...");
          }
      } catch(e) {}

      // 2. Fetch KMB
      try {
          setLoadProgress(40, "Fetching KMB Network...");
          const [kmbRoutesRes, kmbStopsRes, kmbRouteStopsRes] = await Promise.all([
              fetch(`${KMB_API_BASE}/route/`).then(r => r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/stop/`).then(r => r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/route-stop/`).then(r => r.json()).catch(()=>null)
          ]);

          setLoadProgress(80, "Building System Index...");
          const allKmbStops = {};
          if (kmbStopsRes && kmbStopsRes.data) kmbStopsRes.data.forEach(s => { allKmbStops[s.stop] = s; });

          const formatStopName = (name) => name ? name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ') : '';

          if (kmbRoutesRes && kmbRouteStopsRes) {
              const kmbRouteStopsMap = {};
              kmbRouteStopsRes.data.forEach(rs => {
                  const key = `KMB_${rs.route}_${rs.bound}_${rs.service_type}`;
                  if (!kmbRouteStopsMap[key]) kmbRouteStopsMap[key] = [];
                  kmbRouteStopsMap[key].push(rs);
              });

              kmbRoutesRes.data.forEach(r => {
                  const rId = `KMB_${r.route}_${r.bound}_${r.service_type}`;
                  const rsData = kmbRouteStopsMap[rId];
                  if (!rsData) return;

                  rsData.sort((a,b) => parseInt(a.seq) - parseInt(b.seq));
                  routeStopsCache[rId] = rsData.map(rs => {
                      const stopDetail = allKmbStops[rs.stop] || { name_en: 'Unknown', lat: '0', long: '0' };
                      return { stopId: rs.stop, stopName_e: formatStopName(cleanStopName(stopDetail.name_en)), latitude: stopDetail.lat, longitude: stopDetail.long, seq: rs.seq };
                  });

                  const company = (r.route.startsWith('E') || r.route.startsWith('A') || r.route.startsWith('NA') || r.route.startsWith('S')) ? 'LWB' : 'KMB';
                  const cleanDestE = formatStopName(cleanStopName(r.dest_en));
                  const groupKey = `KMB_${r.route}___${cleanDestE}`.replace(/[^a-zA-Z0-9_-]/g, '_');

                  if (!groupedMap.has(groupKey)) {
                      groupedMap.set(groupKey, { key: groupKey, routeNo: r.route, dest_e: cleanDestE, routeIds: [rId], company: company });
                  } else {
                      groupedMap.get(groupKey).routeIds.push(rId);
                  }
              });
          }
      } catch(e) {}

      groupedRoutes = Array.from(groupedMap.values());
      try {
        localStorage.setItem('kmb_grouped_v2', JSON.stringify(groupedRoutes));
        localStorage.setItem('kmb_stops_v2', JSON.stringify(routeStopsCache));
        localStorage.setItem('kmb_cache_time_v2', Date.now().toString());
      } catch (e) {}
    }
    
    buildAllStopsList();
    initLeaflet();
    
    // Start locating and rendering
    await locateNearestStopPromise();
    startTimer();
    
  } catch (err) {
    document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="color:var(--kmb-red);">Error connecting to transit network.</div>';
  }
}

function buildAllStopsList() {
  const uniqueStops = new Map();
  groupedRoutes.forEach(g => {
    g.routeIds.forEach(id => {
      (routeStopsCache[id] || []).forEach(s => {
        if (!s || !s.stopName_e) return;
        const key = getGlobalStopKey(s);
        if (!uniqueStops.has(key)) {
            uniqueStops.set(key, { ...s, stopKey: key, routes: new Set([g.key]) });
        } else {
            uniqueStops.get(key).routes.add(g.key);
        }
      });
    });
  });
  allStops = Array.from(uniqueStops.values());
}

function getStopsForGroup(group) {
  const uniqueMap = new Map();
  if (!group || !group.routeIds || group.routeIds.length === 0) return [];
  const primaryRouteId = group.routeIds[0]; 
  
  let seq = 1;
  (routeStopsCache[primaryRouteId] || []).forEach(s => {
     const key = getGlobalStopKey(s);
     if (s && s.stopName_e && !uniqueMap.has(key)) {
        uniqueMap.set(key, { ...s, stopKey: key, seq: seq++ });
     }
  });
  return Array.from(uniqueMap.values());
}

// --- Geometry Utils ---
function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// --- GPS Location ---
function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); resolve(false); return;
        }

        document.getElementById('mainLocationText').innerText = 'Locating...';

        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            if(userMarker && mapInstance) userMarker.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
            
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                document.getElementById('mainLocationText').innerText = closest.stopName_e;
                renderMainNearby();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stops';
                document.getElementById('mainRouteList').innerHTML = '';
            }
            resolve(true);
        }, () => {
            document.getElementById('mainLocationText').innerText = 'Location Access Denied';
            renderMainNearby(); resolve(false);
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

// --- UI Navigation ---
function switchTab(tabId) {
    if (tabId === 'main') {
        // If clicking Main while already on main, re-trigger GPS lock
        if (currentView === 'main') {
            mainExpandedGroupKey = null; // collapse all
            locateNearestStopPromise();
        }
    }
    
    currentView = tabId;
    detailRouteGroup = null; // Exit detail state fully
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('favRouteBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = tabId === 'search' ? 'Search Routes' : (tabId === 'fav' ? 'Favorites' : 'Bus HK');
    
    if (tabId === 'search') renderSearchResults();
    if (tabId === 'fav') renderFavList();
    if (tabId === 'main') {
        locateNearestStopPromise();
    }
}

function openRouteDetail(groupKey) {
    const group = groupedRoutes.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    currentView = 'detail';
    
    // UI Updates
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = `${group.routeNo} To ${group.dest_e}`;
    
    const favBtn = document.getElementById('favRouteBtn');
    favBtn.style.display = 'block';
    favBtn.innerText = favRoutes.includes(groupKey) ? '★' : '☆';

    setTimeout(() => {
        if(mapInstance) mapInstance.invalidateSize();
        drawRouteOnMap(group);
        renderStopList();
    }, 100);
}

function navigateBack() {
    switchTab(previousView);
}

function toggleFavRoute() {
    if(!detailRouteGroup) return;
    const key = detailRouteGroup.key;
    const idx = favRoutes.indexOf(key);
    if(idx > -1) favRoutes.splice(idx, 1);
    else favRoutes.push(key);
    
    localStorage.setItem('kmb_fav_routes_v2', JSON.stringify(favRoutes));
    document.getElementById('favRouteBtn').innerText = favRoutes.includes(key) ? '★' : '☆';
}

function toggleInactive() {
    showInactive = !showInactive;
    document.getElementById('toggleInactiveBtn').innerText = showInactive ? 'Hide Inactive Routes' : 'Show Inactive Routes';
    renderMainNearby();
}

// --- Map Logic ---
function initLeaflet() {
    mapInstance = L.map('map-container', { zoomControl: false }).setView([22.3, 114.16], 11);
    // Use Standard OpenStreetMap tiles (Free, no API key)[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapInstance);
    
    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
    
    // GPS marker
    const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div style="width:16px;height:16px;background:#0a84ff;border-radius:50%;border:2px solid white;box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>', iconSize: [16, 16] });
    if(lastKnownPos) {
        userMarker = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(mapInstance);
    }
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = getStopsForGroup(group);
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: 'var(--kmb-red)', weight: 5, opacity: 0.9}).addTo(mapInstance);
    
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:12px;height:12px;background:var(--bg-white);border:2px solid var(--text-sub);border-radius:50%;"></div>', iconSize: [12, 12] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => {
            expandStop(idx);
            document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        mapMarkers.push(marker);
    });
    
    mapInstance.fitBounds(mapRouteLayer.getBounds(), { padding: [30, 30] });
}

// --- Render Main View ---
async function renderMainNearby() {
    const listEl = document.getElementById('mainRouteList');
    if (!currentNearestStopKey) {
        if(allStops.length > 0 && !document.getElementById('mainLocationText').innerText.includes('Denied')) {
             listEl.innerHTML = '<div class="text-center">Locating...</div>';
        }
        return;
    }
    
    const stopObj = allStops.find(s => s.stopKey === currentNearestStopKey);
    if (!stopObj) return;

    let relevantGroups = [];
    stopObj.routes.forEach(groupKey => {
        const group = groupedRoutes.find(g => g.key === groupKey);
        if (group) relevantGroups.push(group); 
    });
    
    // Sort by route number roughly
    relevantGroups.sort((a,b) => {
        const numA = parseInt(a.routeNo.replace(/[^0-9]/g, '')) || 999;
        const numB = parseInt(b.routeNo.replace(/[^0-9]/g, '')) || 999;
        return numA - numB;
    });

    let html = '';
    relevantGroups.forEach(g => {
        html += `
          <div class="route-list-item" onclick="toggleMainEta('${g.key}')" id="main-item-${g.key}">
              <div class="route-no-col">${g.routeNo}</div>
              <div class="route-info-col">
                  <div class="route-dest">To ${g.dest_e}</div>
                  <div class="route-sub">${g.company}</div>
              </div>
              <div class="route-eta-col" id="main-eta-summary-${g.key}">
                 <div style="font-size:0.9rem; color:var(--text-sub);">...</div>
              </div>
          </div>
          <div class="eta-expanded-container" id="main-eta-expanded-${g.key}"></div>
        `;
    });
    listEl.innerHTML = html || '<div class="text-center">No routes found for this stop.</div>';
    document.getElementById('toggleInactiveBtn').style.display = relevantGroups.length > 0 ? 'block' : 'none';

    // Fetch ETAs for main view silently
    for (const group of relevantGroups) {
        const sumId = `main-eta-summary-${group.key}`;
        const itemDom = document.getElementById(`main-item-${group.key}`);
        
        try {
            const arrs = await fetchEtaRaw(group, currentNearestStopKey);
            if(arrs.length > 0) {
                const targetMs = new Date(arrs[0].estimatedArrivalTime.replace(/-/g, '/')).getTime();
                let mins = Math.max(0, Math.floor((targetMs - Date.now())/60000));
                let isScheduled = (arrs[0].noGPS === 1 || arrs[0].noGPS === '1');
                
                let timeHtml = mins === 0 ? 'Due' : `${mins}<span style="font-size:1rem;">m</span>`;
                let colorClass = isScheduled ? 'color: var(--accent-orange)' : 'color: var(--accent-green)';
                let labelHtml = isScheduled ? 'Sch' : 'Act';
                
                document.getElementById(sumId).innerHTML = `
                    <div class="eta-time" style="${colorClass}">${timeHtml}</div>
                    <div class="eta-label">${labelHtml}</div>
                `;
                itemDom.style.display = 'flex';
                
                // If it's already expanded, render the inside too
                if (mainExpandedGroupKey === group.key) {
                    renderExpandedETAs(arrs, group, currentNearestStopKey, `main-eta-expanded-${group.key}`);
                }
            } else {
                document.getElementById(sumId).innerHTML = `<div class="eta-time" style="color:var(--text-sub)">--</div>`;
                if(!showInactive) itemDom.style.display = 'none';
            }
        } catch(e) {
            if(document.getElementById(sumId)) document.getElementById(sumId).innerHTML = '--';
            if(!showInactive && itemDom) itemDom.style.display = 'none';
        }
    }
}

async function toggleMainEta(groupKey) {
    const expandContainer = document.getElementById(`main-eta-expanded-${groupKey}`);
    if (!expandContainer) return;
    
    if (mainExpandedGroupKey === groupKey) {
        // Collapse
        expandContainer.classList.remove('active');
        mainExpandedGroupKey = null;
    } else {
        // Collapse previous
        if (mainExpandedGroupKey) {
            const prev = document.getElementById(`main-eta-expanded-${mainExpandedGroupKey}`);
            if (prev) prev.classList.remove('active');
        }
        
        mainExpandedGroupKey = groupKey;
        expandContainer.classList.add('active');
        expandContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center;">Loading times...</div>';
        
        const group = groupedRoutes.find(g => g.key === groupKey);
        if(group && currentNearestStopKey) {
            try {
                const arrs = await fetchEtaRaw(group, currentNearestStopKey);
                renderExpandedETAs(arrs, group, currentNearestStopKey, `main-eta-expanded-${groupKey}`);
            } catch(e) {
                expandContainer.innerHTML = '<div style="color:var(--kmb-red); text-align:center;">Failed to load.</div>';
            }
        }
    }
}

// Shared renderer for the 3 ETAs drop-down (Main Page or Detail Page)
function renderExpandedETAs(arrs, group, stopKey, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    if (arrs.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding: 10px;">No further departures scheduled.</div>';
        return;
    }
    
    // Dummy capacity for visualization
    const stops = getStopsForGroup(group);
    const stopIdx = stops.findIndex(s => s.stopKey === stopKey);
    const occPct = calculateOccupancy(group.routeNo, group.dest_e, Math.max(0, stopIdx), stops.length, Date.now());
    let occClass = occPct > 85 ? 'occ-full' : (occPct > 55 ? 'occ-standing' : 'occ-seating');
    let occText = occPct > 85 ? 'Full' : (occPct > 55 ? 'Standing' : 'Seating');
    
    let html = '';
    for(let i = 0; i < Math.min(3, arrs.length); i++) {
        const arr = arrs[i];
        const targetMs = new Date(arr.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        let mins = Math.max(0, Math.floor((targetMs - Date.now())/60000));
        let isScheduled = (arr.noGPS === 1 || arr.noGPS === '1');
        
        let timeStr = mins === 0 ? 'Due' : `${mins} <span style="font-size:1.1rem; font-weight:600;">min</span>`;
        let color = isScheduled ? 'var(--accent-orange)' : 'var(--accent-green)'; 
        let label = isScheduled ? 'Scheduled' : 'Actual';
        
        let occBadge = i === 0 ? `<span class="occ-pill ${occClass}">${occText}</span>` : '';
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left">
                    <span class="eta-row-seq">${i+1}</span>
                    <span>${label}</span>
                    ${occBadge}
                </div>
                <div class="eta-row-time" style="color:${color};">${timeStr}</div>
            </div>
        `;
    }
    container.innerHTML = html;
}

// --- Render Search & Favs ---
function setRegionFilter(region) {

    document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`filter-${region}`).classList.add('active');

}

function renderSearchResults() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('searchResults');
    
    let matches = groupedRoutes;
    
    if (activeRegionFilter !== 'ALL') {
        matches = matches.filter(g => g.company === activeRegionFilter);
    }
    
    if(query) {
        matches = matches.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    }
    
    if(matches.length === 0) {
        listEl.innerHTML = '<div class="text-center" style="padding-top:60px; font-size:4rem; opacity:0.2;">🚌</div><div class="text-center" style="padding-top:0;">No routes found</div>';

    }
    
    // If no query and ALL is selected, don't render all 600 routes, just ask to search.
    if (!query && activeRegionFilter === 'ALL') {
         listEl.innerHTML = '<div class="text-center" style="padding-top:60px; font-size:4rem; opacity:0.2;">🔍</div><div class="text-center" style="padding-top:0;">Type route number to search</div>';
         return;
    }
    
    let html = '';
    matches.slice(0, 100).forEach(g => {
        html += `
          <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
              <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>
              <div class="route-info-col">
                  <div class="route-dest">To ${g.dest_e}</div>
                  <div class="route-sub">${g.company}</div>
              </div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function renderFavList() {
    const listEl = document.getElementById('favList');
    
    let html = `
        <div class="add-fav-btn" onclick="switchTab('search')">
            + Add New Favorite Route
        </div>
    `;

    if(favRoutes.length === 0) {
        html += '<div class="text-center">No bookmarks yet.</div>';

    }
    
    favRoutes.forEach(k => {
        const g = groupedRoutes.find(r => r.key === k);
        if(g) {
            html += `
              <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
                  <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>
                  <div class="route-info-col">
                      <div class="route-dest">To ${g.dest_e}</div>
                      <div class="route-sub">${g.company}</div>
                  </div>
              </div>
            `;
        }
    });
    listEl.innerHTML = html;
}

// --- Render Detail Stop List ---
function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    const stops = getStopsForGroup(detailRouteGroup);
    
    let html = '';
    stops.forEach((s, idx) => {
        html += `
            <div class="stop-item" id="stop-item-${idx}" onclick="expandStop(${idx})">
                <div class="stop-line"></div>
                <div class="stop-dot" id="stop-dot-${idx}"></div>
                <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
                <div class="eta-expanded-container" id="detail-eta-expanded-${idx}" style="margin-top: 16px; border-radius:8px;"></div>
            </div>
        `;
    });
    listEl.innerHTML = html;

async function expandStop(idx) {
    if (detailExpandedStopIdx === idx) {
        // Collapse
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:12px;height:12px;background:var(--bg-white);border:2px solid var(--text-sub);border-radius:50%;"></div>', iconSize: [12, 12] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    // Collapse previous
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) {
            mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:12px;height:12px;background:var(--bg-white);border:2px solid var(--text-sub);border-radius:50%;"></div>', iconSize: [12, 12] }));
        }
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: '<div style="width:16px;height:16px;background:var(--bg-white);border:4px solid var(--kmb-red);border-radius:50%;"></div>', iconSize: [16, 16] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    const stops = getStopsForGroup(detailRouteGroup);
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchEtaRaw(detailRouteGroup, targetStop.stopKey);
        renderExpandedETAs(arrs, detailRouteGroup, targetStop.stopKey, `detail-eta-expanded-${idx}`);
    } catch(e) {
        expandContainer.innerHTML = '<div style="color:var(--kmb-red); text-align:center;">Failed to fetch ETAs.</div>';
    }
}

// --- API Helpers ---
async function fetchEtaRaw(group, stopKeyToMatch) {
    let combined = [];
    const now = Date.now();
    
    await Promise.all(group.routeIds.map(async (rId) => {
        const stops = routeStopsCache[rId] || [];
        const tIndex = stops.findIndex(s => getGlobalStopKey(s) === stopKeyToMatch);
        if (tIndex === -1) return;
        
        const targetStop = stops[tIndex];
        
        if (rId.startsWith('KMB_')) {
            const parts = rId.split('_');
            const routeNo = parts[1], dir = parts[2], serviceType = parts[3];
            try {
                const res = await fetchJSON(`${KMB_API_BASE}/eta/${targetStop.stopId}/${routeNo}/${serviceType}`);
                if(res && res.data) {
                    res.data.filter(e => e.dir === dir && e.eta).forEach(e => {
                        combined.push({
                            estimatedArrivalTime: e.eta.replace('T', ' ').substring(0, 19),
                            noGPS: (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0
                        });
                    });
                }
            } catch(e) {}
        } else {
            const rawNlbId = rId.replace('NLB_', '');
            try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${targetStop.stopId}&language=en`);
                if(res && res.estimatedArrivals) {
                    res.estimatedArrivals.forEach(arr => combined.push(arr));
                }
            } catch(e) {}
        }
    }));
    
    // Filter out past ETAs and sort
    return combined.filter(arr => new Date(arr.estimatedArrivalTime.replace(/-/g, '/')).getTime() > now - 60000)
                   .sort((a,b) => a.estimatedArrivalTime.localeCompare(b.estimatedArrivalTime));
}

// Reused simple occupancy model
function calculateOccupancy(routeNo, destName, currentStopIndex, totalStops, currentTimestamp) {
  const date = new Date(currentTimestamp);
  const hour = date.getHours();
  const day = date.getDay(); 
  const isWeekend = (day === 0 || day === 6);
  let baseLoad = 30; 
  
  if (!isWeekend) {
    if (hour >= 7 && hour <= 9) baseLoad = 75;
    else if (hour >= 17 && hour <= 20) baseLoad = 85;
  } else {
    if (hour >= 9 && hour <= 19) baseLoad = 65;
  }
  
  let progress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
  let spatialMultiplier = Math.sin(progress * Math.PI) + 0.3;
  
  return Math.min(100, Math.max(0, Math.round(baseLoad * spatialMultiplier)));
}

// --- Global App Loop ---
function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      // Auto refresh depending on view
      if (currentView === 'main') {
          // If a stop is expanded, rendering will handle re-fetching that inside `renderMainNearby`
          // Actually, our current logic only silent updates the summary. 
          // I will manually refresh the expanded portion if needed.
          renderMainNearby().then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = getStopsForGroup(detailRouteGroup);
          const targetStop = stops[detailExpandedStopIdx];
          fetchEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              renderExpandedETAs(arrs, detailRouteGroup, targetStop.stopKey, `detail-eta-expanded-${detailExpandedStopIdx}`);
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else {
          isSyncing = false;
      }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}
